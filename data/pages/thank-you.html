<style id="fluent_snippet_14-global-css-inline">/* ================================
TEXT UNDERLINES
================================ */
.underline,
.underlinelight {
position: relative;
display: inline;
}

.underline::after,
.underlinelight::after {
content: '';
position: absolute;
left: 0;
width: 100%;
bottom: 0;
background: var(--grad-color, currentColor);
}

.underline::after { height: 2px; }
.underlinelight::after { height: 1px; }

/* ================================
SLIDER PAGINATION LIMIT
================================ */

/* Desktop: show max 3 */
.splide__pagination li:nth-child(n+4),
.swiper-pagination-bullet:nth-child(n+4) {
display: none !important;
opacity: 0 !important;
visibility: hidden !important;
}

/* Mobile: show max 2 */
@media (max-width: 767px) {
.splide__pagination li:nth-child(n+3),
.swiper-pagination-bullet:nth-child(n+3) {
display: none !important;
opacity: 0 !important;
visibility: hidden !important;
}
}

/* Center pagination */
.splide__pagination,
.swiper-pagination {
display: flex !important;
justify-content: center !important;
gap: 8px;
}

/* ================================
EDITOR CLEANUP
================================ */
#bricks-editor .element:focus,
#bricks-editor .element:focus-within {
outline: none !important;
}

/* ================================
GRID CONTEXT
================================ */
.process-grid {
position: relative;
isolation: isolate;
}

/* ================================
TAB BUTTONS
================================ */
.tab-button {
cursor: pointer;
transition: all 0.3s ease;
opacity: 0.6;
border: 2px solid transparent;
}

.tab-button:hover {
opacity: 0.9;
transform: translateY(-2px);
}

.tab-button.active {
opacity: 1 !important;
background-color: #E3F4F6 !important;
box-shadow: 0 0 0 2px #5EB1BF !important;
color: #0e3f4a !important;
}

/* ================================
RADIO & CHECKBOX STATES
================================ */
input[type="radio"]:checked + div,
input[type="radio"]:checked + label,
.bf-radio-button input:checked + .bf-radio-content,
input[type="checkbox"]:checked + div,
input[type="checkbox"]:checked + label {
box-shadow: 0 0 0 2px #5EB1BF !important;
}

/* ================================
INPUT FOCUS + SAFARI FIXES
================================ */
input,
textarea,
select {
color: inherit;
-webkit-text-fill-color: currentColor;
}

input:focus,
textarea:focus,
select:focus {
outline: none;
border-color: #5EB1BF !important;
box-shadow: 0 0 0 3px rgba(94, 177, 191, 0.2);
}

/* iOS Safari autofill fix */
input:-webkit-autofill,
textarea:-webkit-autofill,
select:-webkit-autofill {
-webkit-text-fill-color: currentColor !important;
transition: background-color 9999s ease-in-out 0s;
}

/* ================================
FORM SUBMIT BUTTON FIX ONLY
================================ */
.brxe-form input[type="submit"],
.brxe-form button[type="submit"] {
-webkit-appearance: none;
appearance: none;

color: inherit;
-webkit-text-fill-color: currentColor;
}

/* Ensure inner elements behave */
.brxe-form button[type="submit"] * {
color: inherit;
-webkit-text-fill-color: currentColor;
}

/* SVG inside submit button */
.brxe-form button[type="submit"] svg {
fill: currentColor;
}

/* ================================
FORM LABEL STRUCTURE
================================ */
.bf-custom-label {
display: flex;
flex-direction: column;
line-height: 1.3;
}

.bf-label-title {
font-size: var(--aptext-m);
font-weight: 400;
}

.bf-label-subtitle {
font-size: var(--aptext-xs);
opacity: 0.8;
margin-top: 0;
}

/* ================================
REMOVE UNWANTED FIELD STATES
================================ */
label[for*="form-field-timing"],
label[for*="form-field-services"] {
border: none !important;
outline: none !important;
box-shadow: none !important;
}

input[id*="form-field-timing"]:checked + label,
input[id*="form-field-services"]:checked + label,
input[id*="form-field-timing"]:focus + label,
input[id*="form-field-services"]:focus + label {
border: none !important;
outline: none !important;
box-shadow: none !important;
}

/* ================================
GRADIENT TEXT (STRICTLY SCOPED)
================================ */
[data-highlight].has-gradient-highlight {
-webkit-background-clip: initial !important;
background-clip: initial !important;
}

[data-highlight].has-gradient-highlight span {
-webkit-background-clip: text !important;
background-clip: text !important;
-webkit-text-fill-color: transparent !important;
background-image: inherit;
}

/* ================================
HEADER LOGO (note, not a fix)
The header logo is a raster PNG (Bricks attachment 37386 -> Ampy-logo.png).
The earlier raster-in-SVG (a 701x201 PNG that declared its size as 90x28)
rendered blurry on iOS because Safari rasterizes an SVG-as-img at the
declared intrinsic size. Fixed by swapping the ASSET to a real raster,
not via CSS. Display size is set by Bricks logoHeight per breakpoint.
================================ */

/* Prevent gradient interference */
svg * {
-webkit-text-fill-color: initial !important;
}

/* ================================
UNDERLINE SAFETY FIX
================================ */
span[style*="text-decoration: underline"] {
-webkit-text-fill-color: initial !important;
color: inherit !important;
}

/* ================================
AMPY CALL-BUTTON ICON CHIP (puls-ring)
Adds ONLY the round pulsing background behind the phone glyph.
Geometry is deliberately untouched: no width/height, no button padding,
no gap -- the svg keeps its existing 24px box via box-sizing:border-box,
so the button's balance is exactly as the owner set it in Bricks.
(The glyph sits ~4px inside the disc as a result. To match the Hero 1
proportions instead, raise the svg box to 36px in Bricks -- owner's call.)
The chip is WHITE on all of them. A navy chip was tried on the blue-cta
(whose icon is white) but that button is near-black, so a dark disc on a
dark button was effectively invisible -- owner's call, 2026-07-27.
  ONLY .brxe-12f74e (blue-cta-__button) is still handled here.
  .brxe-679b49 (ce-block__button) and .brxe-f76647 (footer-seo__button) were
  both reverted out on 2026-07-27 — the owner styles those in Bricks himself.
  Do not re-add them: a rule here is (0,2,1) and would override the builder.
  .brxe-12f74e blue-cta-__button   icon was #fff -> flipped to ink so it
                                   reads on the white chip (see below)
Buttons that already carry a chip (1337d2, yejhro, cbdhet, 395b4f) are
intentionally excluded.
================================ */
a.brxe-12f74e[href^="tel:"] svg {
  flex: 0 0 auto;
  /* 36px disc / ~17px glyph — the Hero 1 proportions (template 15556).
     The asymmetric padding is the owner's optical centring of the handset. */
  width: 36px;
  height: 36px;
  padding: 10.5px 10.5px 8.5px 8.5px;
  box-sizing: border-box;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.92);
  overflow: visible;
  animation: ampyChipLight 2.8s cubic-bezier(0.4, 0, 0.4, 1) infinite;
}

/* blue-cta only: its glyph is white, which would vanish on the white chip.
   Same ink as every other chipped CTA on the site (hsl(237 35% 24%)).
   NOTE: if the icon colour is set in Bricks instead, delete this rule --
   otherwise it will win over the builder (0,2,1 vs 0,1,1). */
a.brxe-12f74e[href^="tel:"] svg {
  color: rgb(40, 42, 83);
  stroke: rgb(40, 42, 83);
}

@keyframes ampyChipLight {
  0%   { box-shadow: 0 1px 3px rgba(9, 11, 50, 0.14), 0 0 0 0 rgba(255, 255, 255, 0.65); }
  55%  { box-shadow: 0 1px 3px rgba(9, 11, 50, 0.14), 0 0 0 9px rgba(255, 255, 255, 0); }
  100% { box-shadow: 0 1px 3px rgba(9, 11, 50, 0.14), 0 0 0 0 rgba(255, 255, 255, 0); }
}

@media (prefers-reduced-motion: reduce) {
  a.brxe-12f74e[href^="tel:"] svg { animation: none; }
}</style>

	<style>/*
	 * Bricks sets overflow:hidden on #brx-header.brx-sticky.sliding
	 * which clips the mega menu dropdowns.
	 * Restore overflow only while a dropdown is open.
	 * :has([aria-expanded="true"]) targets the toggle button state
	 * Bricks already manages natively — no JS needed.
	 */
	#brx-header.brx-sticky.sliding:has([aria-expanded="true"]) {
		overflow: visible !important;
	}
	
	/*
	 * Sticky header = ALWAYS visible AND in normal flow.
	 * Bricks forces position:fixed for sticky headers, which pulls the header
	 * out of flow so page content slides underneath it (hero overlap). Using
	 * position:sticky keeps the header in flow (it reserves its own height so
	 * the hero starts below it) while still pinning to the top on scroll.
	 * headerStickyOnScroll was removed in _bricks_template_settings (2026-07-13)
	 * so there is no hide-on-scroll behaviour to preserve.
	 */
	#brx-header.brx-sticky {
		position: sticky !important;
		top: 0 !important;
	}
	.admin-bar #brx-header.brx-sticky { top: 32px !important; }
	@media screen and (max-width: 782px) {
		.admin-bar #brx-header.brx-sticky { top: 46px !important; }
	}</style>

<style>.ampy-tack{
  --at-ink:#0b1030;
  --at-ink-soft:rgba(11,16,48,.62);
  --at-teal:#00a991;
  --at-teal-deep:#018271;
  --at-gold:#f6b53d;
  --at-ease:cubic-bezier(.16,.84,.44,1);
  --at-ease-soft:cubic-bezier(.33,1,.68,1);

  position:relative; z-index:0;
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(16px, 2vw, 20px);
  padding:clamp(24px, 4vw, 48px) clamp(16px, 1.25vw + 12px, 28px);
  overflow:hidden;
  box-sizing:border-box;
  font-family:"Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color:var(--at-ink);
  background:
    radial-gradient(115% 85% at 14% -12%, rgba(0,169,145,.12) 0%, rgba(0,169,145,0) 46%),
    radial-gradient(105% 75% at 94% 6%,  rgba(182,242,255,.48) 0%, rgba(182,242,255,0) 44%),
    radial-gradient(120% 95% at 90% 112%, rgba(160,251,201,.28) 0%, rgba(160,251,201,0) 48%),
    radial-gradient(115% 90% at 8% 104%, rgba(0,169,145,.08) 0%, rgba(0,169,145,0) 46%),
    #f5f9ff;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.ampy-tack *,.ampy-tack *::before,.ampy-tack *::after{ box-sizing:border-box; }

/* decorative aurora corner art (inline SVG in the markup) */
.ampy-tack__aurora{ position:absolute; z-index:0; pointer-events:none; user-select:none; opacity:.8; height:auto; }
.ampy-tack__aurora--top{ top:0; right:0; width:clamp(200px, 30vw, 400px); }
.ampy-tack__aurora--bottom{ bottom:0; left:0; width:clamp(150px, 22vw, 280px); }

/* the contained glass card = the anchor */
.ampy-tack__card{
  position:relative; z-index:1; width:100%; max-width:520px;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  gap:clamp(18px, 2.4vw, 24px);
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.9);
  border-radius:clamp(24px, 0.83vw + 21px, 32px);
  box-shadow:0 30px 70px rgba(9,11,50,.12), inset 0 1px 0 rgba(255,255,255,.6);
  -webkit-backdrop-filter:blur(16px) saturate(1.1);
  backdrop-filter:blur(16px) saturate(1.1);
  padding:clamp(32px, 4.5vw, 52px) clamp(28px, 4vw, 56px);
}
.ampy-tack__intro{ display:flex; flex-direction:column; align-items:center; gap:clamp(16px, 2.2vw, 22px); }

/* living pale-mint check */
.ampy-tack__check{ position:relative; width:clamp(88px, 11vw, 104px); height:clamp(88px, 11vw, 104px); display:grid; place-items:center; }
.ampy-tack__check-svg{ position:relative; z-index:2; width:100%; height:100%; overflow:visible; }
.ampy-tack__halo{
  position:absolute; inset:6%; z-index:1; border-radius:50%;
  background:radial-gradient(circle, rgba(85,255,154,.30) 0%, rgba(85,255,154,0) 72%);
  animation:ampy-tack-halo 4s var(--at-ease-soft) infinite;
}
.ampy-tack__disc{ transform-origin:center; animation:ampy-tack-disc 640ms var(--at-ease) both; }
.ampy-tack__tick{ stroke-dasharray:120; stroke-dashoffset:120; animation:ampy-tack-tick 560ms var(--at-ease) 300ms both; }
@keyframes ampy-tack-disc{ 0%{ transform:scale(.62); opacity:0; } 62%{ transform:scale(1.05); } 100%{ transform:scale(1); opacity:1; } }
@keyframes ampy-tack-tick{ to{ stroke-dashoffset:0; } }
@keyframes ampy-tack-halo{ 0%{ transform:scale(.8); opacity:0; } 34%{ opacity:.8; } 100%{ transform:scale(1.4); opacity:0; } }

/* hero */
.ampy-tack__hero{ display:flex; flex-direction:column; gap:clamp(13px, 0.73vw + 10px, 20px); }
.ampy-tack__title{
  margin:0; font-size:clamp(28px, 1.25vw + 24px, 40px); line-height:1.14; font-weight:500;
  letter-spacing:-.018em; color:var(--at-ink); white-space:nowrap;
}
.ampy-tack__sub{
  margin:0; font-size:clamp(16px, 0.21vw + 15px, 18px); line-height:1.5; font-weight:400;
  color:var(--at-ink-soft); white-space:nowrap;
}

/* proof — plain text (rating only) */
.ampy-tack__proof{ display:flex; flex-direction:column; align-items:center; gap:5px; }
.ampy-tack__rating{ margin:0; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:3px 7px; }
.ampy-tack__stars{ display:inline-flex; gap:3px; }
.ampy-tack__stars svg{ width:16px; height:16px; fill:var(--at-gold); }
.ampy-tack__ratingtext{ font-size:clamp(14px, 0.21vw + 13px, 16px); font-weight:400; color:var(--at-ink-soft); line-height:1; }
.ampy-tack__ratingtext strong{ font-weight:600; color:var(--at-ink); }

/* hairline divider */
.ampy-tack__divider{ width:60px; height:1px; border:0; margin:0;
  background:linear-gradient(90deg, transparent, rgba(0,169,145,.35), transparent); }

/* proportionate primary CTA */
.ampy-tack__cta-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
.ampy-tack__cta{
  display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  padding:14px 28px; border-radius:999px;
  font-size:clamp(14px, 0.21vw + 13px, 16px); font-weight:600; color:#fff;
  background:linear-gradient(135deg,#00b89c,#018271);
  box-shadow:0 10px 24px rgba(0,169,145,.3);
  transition:transform .2s var(--at-ease), box-shadow .2s var(--at-ease);
}
.ampy-tack__cta:hover{ transform:translateY(-2px); box-shadow:0 16px 30px rgba(0,169,145,.38); }
.ampy-tack__cta svg{ width:14px; height:13px; fill:currentColor; transition:transform .2s var(--at-ease); }
.ampy-tack__cta:hover svg{ transform:translateX(3px); }

/* ghost back-to-home (part of the centred group) */
.ampy-tack__ghost{
  position:relative; z-index:1;
  font-size:clamp(14px, 0.21vw + 13px, 16px); font-weight:500; color:var(--at-ink-soft);
  text-decoration:none; padding:9px 16px; border-radius:999px;
  transition:color .18s ease, background .18s ease;
}
.ampy-tack__ghost:hover{ color:var(--at-teal-deep); background:rgba(0,169,145,.08); }

.ampy-tack a:focus-visible{ outline:3px solid var(--at-teal); outline-offset:3px; border-radius:12px; }

/* mobile */
@media (max-width:520px){
  .ampy-tack__card{ padding:36px 24px; gap:20px; border-radius:clamp(16px, 0.42vw + 15px, 20px); }
  .ampy-tack__title{ font-size:clamp(24px, 0.83vw + 21px, 32px); white-space:normal; text-wrap:balance; }
  .ampy-tack__sub{ font-size:clamp(16px, 0.21vw + 15px, 18px); white-space:normal; text-wrap:balance; }
  .ampy-tack__title br, .ampy-tack__sub br{ display:none; }
}

/* motion safety */
@media (prefers-reduced-motion: reduce){
  .ampy-tack__disc,.ampy-tack__tick,.ampy-tack__halo{ animation:none !important; }
  .ampy-tack__tick{ stroke-dashoffset:0; }
  .ampy-tack__halo{ opacity:.5; transform:scale(1.1); }
  .ampy-tack__cta,.ampy-tack__cta svg,.ampy-tack__ghost{ transition:none; }

<script>
(function () {
  const OVERLAP_PX = 6;      // bigger overlap to ensure it meets the circle edge
  const LINE_Z = 1;          // line layer
  const ICON_Z = 3;          // icon layer (we'll enforce if needed)

  function isVisible(el) {
    if (!el) return false;
    const cs = getComputedStyle(el);
    if (cs.display === "none" || cs.visibility === "hidden" || cs.opacity === "0") return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }

  // Pick the "real" icon wrapper: choose the biggest visible candidate, avoid <svg> unless it's the only thing.
  function pickIconWrapper(item) {
    const candidates = Array.from(
      item.querySelectorAll(".icon-mobile, .icon-desktop, .process-icon, .icon-box__icon, .brxe-icon, svg, img")
    ).filter(isVisible);

    if (!candidates.length) return null;

    // Prefer non-SVG wrappers by default
    const nonSvg = candidates.filter(el => el.tagName.toLowerCase() !== "svg");
    const pool = nonSvg.length ? nonSvg : candidates;

    // Choose largest box (usually the circle container)
    let best = pool[0];
    let bestArea = 0;

    for (const el of pool) {
      const r = el.getBoundingClientRect();
      const area = r.width * r.height;
      if (area > bestArea) {
        bestArea = area;
        best = el;
      }
    }

    return best;
  }

  function ensureIconsAboveLines(container) {
    // Make sure icon wrappers render above connector lines
    const icons = container.querySelectorAll(".process-icon, .icon-mobile, .icon-desktop, .icon-box__icon, .brxe-icon");
    icons.forEach(el => {
      // Only set if not already positioned; z-index needs positioning
      const cs = getComputedStyle(el);
      if (cs.position === "static") el.style.position = "relative";
      el.style.zIndex = ICON_Z;
    });
  }

  function initAll() {
    const grids = document.querySelectorAll(".process-grid");
    if (!grids.length) return;

    grids.forEach((container) => {
      const processItems = container.querySelectorAll(".process-item");
      const iconBoxes = container.querySelectorAll(".brxe-icon-box");

      let items = [];
      if (processItems.length) items = Array.from(processItems);
      else if (iconBoxes.length) items = Array.from(iconBoxes);
      else items = Array.from(container.children);

      if (items.length < 2) return;

      container.style.position = "relative";
      // If any parent/this has overflow hidden, this helps prevent clipping:
      container.style.overflow = "visible";

      function drawLines() {
        container.querySelectorAll(".connector-line").forEach(el => el.remove());

        const containerRect = container.getBoundingClientRect();

        // Keep icons above lines
        ensureIconsAboveLines(container);

        for (let i = 0; i < items.length - 1; i++) {
          const aEl = pickIconWrapper(items[i]);
          const bEl = pickIconWrapper(items[i + 1]);
          if (!aEl || !bEl) continue;

          const a = aEl.getBoundingClientRect();
          const b = bEl.getBoundingClientRect();

          const ax = a.left + a.width / 2;
          const ay = a.top + a.height / 2;
          const bx = b.left + b.width / 2;
          const by = b.top + b.height / 2;

          const dx = bx - ax;
          const dy = by - ay;

          // Decide orientation per pair (layout-proof)
          const vertical = Math.abs(dy) > Math.abs(dx);

          const line = document.createElement("div");
          line.className = "connector-line";

          if (vertical) {
            const ra = a.height / 2;
            const rb = b.height / 2;

            const x = ax - containerRect.left;
            const y1 = (ay + ra) - containerRect.top - OVERLAP_PX;
            const y2 = (by - rb) - containerRect.top + OVERLAP_PX;

            Object.assign(line.style, {
              position: "absolute",
              left: `${x - 1}px`,
              top: `${Math.min(y1, y2)}px`,
              width: "2px",
              height: `${Math.max(0, Math.abs(y2 - y1))}px`,
              background: "linear-gradient(to bottom, #5EB1BF, #1D234E)",
              WebkitMaskImage: "repeating-linear-gradient(to bottom, black 0px, black 10px, transparent 10px, transparent 15px)",
              maskImage: "repeating-linear-gradient(to bottom, black 0px, black 10px, transparent 10px, transparent 15px)",
              zIndex: LINE_Z,
              pointerEvents: "none"
            });

          } else {
            const ra = a.width / 2;
            const rb = b.width / 2;

            // IMPORTANT: Keep line centered on the circle, but behind it (z-index),
            // so it looks like it runs *under* the icon, not on top.
            const y = ay - containerRect.top;

            const x1 = (ax + ra) - containerRect.left - OVERLAP_PX;
            const x2 = (bx - rb) - containerRect.left + OVERLAP_PX;

            Object.assign(line.style, {
              position: "absolute",
              left: `${Math.min(x1, x2)}px`,
              top: `${y - 1}px`,
              width: `${Math.max(0, Math.abs(x2 - x1))}px`,
              height: "2px",
              background: "linear-gradient(to right, #5EB1BF, #1D234E)",
              WebkitMaskImage: "repeating-linear-gradient(to right, black 0px, black 10px, transparent 10px, transparent 15px)",
              maskImage: "repeating-linear-gradient(to right, black 0px, black 10px, transparent 10px, transparent 15px)",
              zIndex: LINE_Z,

<script>
(function() {

  function initForm() {
    const tabs = document.querySelectorAll('.tab-button');
    
    // FIXED: Look for the correct field name
    const typeField = document.querySelector('input[name="form-field-type"]');
    
    
    if (!typeField) {
      return;
    }
    
    if (tabs.length === 0) {

    }

      tab.addEventListener('click', function(e) {

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('[data-highlight]').forEach(function(el) {
        const config = el.dataset.highlight;
        const parts = config.split('-');
        const position = parts[0];
        const count = parseInt(parts[1]);

        const computed = window.getComputedStyle(el);
        const backgroundImage = computed.backgroundImage;
        const textDecoration = computed.textDecorationLine;
        const color = computed.color;

        const hasGradient = backgroundImage && backgroundImage !== 'none' && backgroundImage.includes('gradient');
        const hasUnderline = textDecoration && textDecoration.includes('underline');

        // NEW: Add a class to the parent element if it has a gradient
        if (hasGradient) {
            el.classList.add('has-gradient-highlight');
        }

        // Extract first color from gradient to use on underline
        let underlineColor = color;
        if (hasGradient) {
            const match = backgroundImage.match(/rgba?([^)]+)|#[0-9a-fA-F]+/);
            if (match) underlineColor = match[0];
        }

        let spanStyle = '';
        if (hasGradient) {
            spanStyle += `background: ${backgroundImage}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;`;
        }
        if (hasUnderline) {
            spanStyle += `text-decoration: underline; text-decoration-color: ${underlineColor}; text-decoration-thickness: 2px; text-underline-offset: 5px;`;
        }

        const words = el.innerHTML.trim().split(' ');

        if (position === 'last') {
            const rest = words.slice(0, words.length - count).join(' ');
            const highlighted = `<span style="${spanStyle}">${words.slice(-count).join(' ')}</span>`;
            el.innerHTML = rest + (rest ? ' ' : '') + highlighted;
        } else if (position === 'first') {
            const highlighted = `<span style="${spanStyle}">${words.slice(0, count).join(' ')}</span>`;
            const rest = words.slice(count).join(' ');
            el.innerHTML = highlighted + (rest ? ' ' : '') + rest;
        }

        if (hasGradient) {
            el.style.backgroundImage = 'none';
            el.style.webkitTextFillColor = 'unset';
        }
        if (hasUnderline) {
            el.style.textDecoration = 'none';
        }
    });
});
</script>

<script>
(function() {
  'use strict';

  const SPLIDE_CHECK_INTERVAL = 50;
  const MAX_ATTEMPTS = 60;
  const processedSliders = new WeakSet();

  function initAllTestimonialPaginations() {
    const sliders = document.querySelectorAll('.testimonial-carousel');
    if (!sliders.length) return;

    sliders.forEach(slider => {
      if (!processedSliders.has(slider)) {
        initTestimonialPagination(slider);
      }
    });
  }

  function initTestimonialPagination(slider) {
    if (!slider) return;

    let attempts = 0;
    
    const checkSplide = setInterval(() => {
      const splideInstance = getSplideInstance(slider);
      attempts++;

      if (splideInstance) {
        clearInterval(checkSplide);
        processedSliders.add(slider);
        setupPagination(slider, splideInstance);
      } else if (attempts >= MAX_ATTEMPTS) {
        clearInterval(checkSplide);
        console.warn('Testimonial slider: Splide instance not found');
      }
    }, SPLIDE_CHECK_INTERVAL);
  }

  function getSplideInstance(slider) {
    if (slider.splide) return slider.splide;
    
    if (window.bricksData?.splideInstances) {
      const elementId = slider.id;
      return window.bricksData.splideInstances[elementId];
    }
    
    const splideEl = slider.querySelector('.splide');
    if (splideEl?.splide) return splideEl.splide;
    
    return null;
  }

  function setupPagination(slider, splide) {
    // Get autoplay interval
    let autoplayInterval = 3000;
    if (splide.options.autoplay) {
      autoplayInterval = splide.options.interval || 3000;
    }

    // Get transition speed
    const transitionSpeed = splide.options.speed || 300;

    // Total duration
    const totalDuration = autoplayInterval + transitionSpeed;

    // Set CSS variable
    slider.style.setProperty('--pagination-loading-duration', `${totalDuration}ms`);

    // Restart animation on slide change
    splide.on('move', () => {
      restartAnimation(slider);
    });

    // Pause on hover
    slider.addEventListener('mouseenter', () => {
      pauseAnimation(slider);
      if (splide.Components.Autoplay) {
        splide.Components.Autoplay.pause();
      }
    });

    // Resume on mouse leave
    slider.addEventListener('mouseleave', () => {
      resumeAnimation(slider);
      if (splide.Components.Autoplay) {
        splide.Components.Autoplay.play();
      }
    });

    // Start animation
    restartAnimation(slider);
  }

  function restartAnimation(slider) {
    const activeBullet = slider.querySelector('.splide__pagination__page.is-active');
    if (!activeBullet) return;

    activeBullet.classList.remove('paused');
    activeBullet.style.animation = 'none';
    activeBullet.offsetHeight;
    activeBullet.style.animation = null;
  }

  function pauseAnimation(slider) {
    const activeBullet = slider.querySelector('.splide__pagination__page.is-active');
    if (activeBullet) {
      activeBullet.classList.add('paused');
    }
  }

  function resumeAnimation(slider) {
    const activeBullet = slider.querySelector('.splide__pagination__page.is-active');
    if (activeBullet) {
      activeBullet.classList.remove('paused');
    }
  }

  // Initialize
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAllTestimonialPaginations);
  } else {
    initAllTestimonialPaginations();
  }

  window.addEventListener('load', initAllTestimonialPaginations);

  // Watch for dynamic content
  if (window.MutationObserver) {
    const observer = new MutationObserver(() => {
      initAllTestimonialPaginations();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }
})();
</script>
